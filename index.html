<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamak</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
  body { background:#0f0f1a; color:#eee; height:100vh; display:flex; flex-direction:column; }
  header { background:#1a1a2e; padding:14px; text-align:center; font-weight:bold; font-size:18px; border-bottom:1px solid #2a2a4a; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; line-height:1.4; }
  .user { align-self:flex-end; background:#3b5bdb; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#26264a; border-bottom-left-radius:4px; }
  #form { display:flex; gap:8px; padding:12px; background:#1a1a2e; }
  input { flex:1; padding:12px 16px; border-radius:24px; border:none; background:#26264a; color:#eee; font-size:15px; outline:none; }
  button { padding:0 20px; border-radius:24px; border:none; background:#3b5bdb; color:#fff; font-size:15px; font-weight:bold; }
</style>
</head>
<body>
<header>Chamak 🔥</header>
<div id="chat"></div>
<form id="form">
  <input id="box" placeholder="bol chamak ko..." autocomplete="off">
  <button>bhej</button>
</form>
<script>
const KEY = "GEMINI_KEY_YAHAN_DAL";
const chat = document.getElementById('chat');
const hist = [];
function add(t, cls){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const box = document.getElementById('box');
  const text = box.value.trim();
  if(!text) return;
  box.value='';
  add(text,'user');
  const wait = add('...','bot');
  hist.push({role:'user',text});
  try {
    const sys = "You are Chamak, a smart, knowledgeable desi bro AI friend. Reply in Hinglish, lowercase, short (2-4 sentences max). Funny, warm, a little roast-y but never mean. Knows history, space, crypto, coding, general knowledge. No buy/sell financial advice.";
    const contents = hist.map(h => ({role: h.role==='user'?'user':'model', parts:[{text:h.text}]}));
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${KEY}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system_instruction:{parts:[{text:sys}]}, contents, generationConfig:{maxOutputTokens:800}})
    });
    const data = await res.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "yaar thoda busy hu, dubara bhej na";
    wait.textContent = reply;
    hist.push({role:'model',text:reply});
  } catch(err) {
    wait.textContent = "network ya quota issue, thodi der baad try kar";
  }
});
</script>
</body>
</html>
